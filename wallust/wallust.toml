# DTOS Wallust Configuration (wallust 3.x)
backend = "fastresize"
color_space = "salience"
palette = "saliencedark16"
threshold = 11
check_contrast = true
saturation = 35

[templates]
json.template = "colors.json"
json.target = "~/.cache/wal/colors.json"

sh.template = "colors.sh"
sh.target = "~/.cache/wal/colors.sh"

alacritty.template = "colors-alacritty.toml"
alacritty.target = "~/.cache/wal/colors-alacritty.toml"

gtk.template = "colors-gtk.css"
gtk.target = "~/.cache/wal/colors-gtk.css"

xresources.template = "colors.Xresources"
xresources.target = "~/.cache/wal/colors.Xresources"
